on:
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/build.yml
  push:
    branches:
      - main
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/build.yml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Lint with golangci-lint
        run: make lint
      - name: check proto format
        run: make proto-format-check

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Build
        run: make build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/qbtcd
  # PRs run the short tests. On main, the tests that generate PLONK proofs
  # (several GB of memory and minutes of CPU each) run one package per
  # runner: together on one runner they ran out of memory and time.
  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Test
        run: make test

  test-all:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: keeper
            pkgs: ./x/qbtc/keeper
          - name: zk
            pkgs: ./x/qbtc/zk
          - name: dkls-tss
            pkgs: ./cmd/dkls-tss
          - name: e2e
            pkgs: ./tests/e2e/qbtc
          - name: rest
            pkgs: rest
    name: test-all (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Test
        run: |
          pkgs='${{ matrix.pkgs }}'
          if [ "$pkgs" = rest ]; then
            pkgs=$(go list ./... | grep -vE '/x/qbtc/keeper$|/x/qbtc/zk$|/cmd/dkls-tss$|/tests/e2e/qbtc$' | tr '\n' ' ')
          fi
          make test-all TEST_PKGS="$pkgs"
