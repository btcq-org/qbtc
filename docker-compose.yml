# A 4-validator qbtc network that follows Bitcoin mainnet. `make localnet`
# (scripts/localnet.sh) generates .testnets/ and starts it; see README.md.
# Host ports can be moved with RPC_PORT_i, API_PORT_i and GRPC_PORT_i.
name: qbtc-localnet

x-validator: &validator
  image: ${QBTC_IMAGE:-btcq-org/qbtc:localnet}
  restart: unless-stopped
  # lets a validator reach a Bitcoin node on the host (BITCOIN_RPC_HOST=localhost)
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  node_0:
    <<: *validator
    ports:
      - "${RPC_PORT_0:-26657}:26657"
      - "${API_PORT_0:-1317}:1317"
      - "${GRPC_PORT_0:-9090}:9090"
    volumes:
      - ./.testnets/validator0:/qbtc_data/.qbtc

  node_1:
    <<: *validator
    ports:
      - "${RPC_PORT_1:-26654}:26654"
      - "${API_PORT_1:-1316}:1316"
      - "${GRPC_PORT_1:-9088}:9088"
    volumes:
      - ./.testnets/validator1:/qbtc_data/.qbtc

  node_2:
    <<: *validator
    ports:
      - "${RPC_PORT_2:-26651}:26651"
      - "${API_PORT_2:-1315}:1315"
      - "${GRPC_PORT_2:-9086}:9086"
    volumes:
      - ./.testnets/validator2:/qbtc_data/.qbtc

  node_3:
    <<: *validator
    ports:
      - "${RPC_PORT_3:-26648}:26648"
      - "${API_PORT_3:-1314}:1314"
      - "${GRPC_PORT_3:-9084}:9084"
    volumes:
      - ./.testnets/validator3:/qbtc_data/.qbtc

  # Bitcoin mainnet through a public Esplora API, for hosts without a Bitcoin
  # node (profile "proxy": scripts/localnet.sh enables it when BITCOIN_RPC_HOST
  # is unset). The same proxy serves the scenario harness in tests/vetest.
  btc-proxy:
    profiles: ["proxy"]
    image: python:3.12-alpine
    restart: unless-stopped
    command: python -u /app/btc_proxy.py
    environment:
      UPSTREAM: ${BTC_UPSTREAM:-esplora:https://mempool.space/api}
      CACHE_DIR: /cache
      BIND: 0.0.0.0
      NUM_VALIDATORS: "4"
      TOOL_PORT: "18449"
      CONTROL_PORT: "18450"
    volumes:
      - ./tests/vetest/btc_proxy.py:/app/btc_proxy.py:ro
      - ./.testnets/btc-cache:/cache
    ports:
      - "127.0.0.1:18449:18449"
      - "127.0.0.1:18450:18450"

networks:
  default:
    name: qbtc-localnet
