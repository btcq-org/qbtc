syntax = "proto3";
package qbtc.lp.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/btcq-org/qbtc/x/lp/types";

// MsgUpdateParam mutates a single mimir-style int64 parameter in the lp
// module. Authority-gated.
message MsgUpdateParam {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "lp/MsgUpdateParam";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string key = 2;
  int64 value = 3;
}

message MsgUpdateParamResponse {}
