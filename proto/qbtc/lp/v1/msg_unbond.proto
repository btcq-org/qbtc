syntax = "proto3";
package qbtc.lp.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/btcq-org/qbtc/x/lp/types";

// MsgUnbond moves units from bonded back to free. Refused while the node is
// in the active validator set unless it is leaving via churn.
message MsgUnbond {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "lp/MsgUnbond";

  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string node_id = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string units = 3 [
    (cosmos_proto.scalar) = "cosmos.Uint",
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
}

message MsgUnbondResponse {}
