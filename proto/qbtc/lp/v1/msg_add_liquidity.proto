syntax = "proto3";
package qbtc.lp.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/btcq-org/qbtc/x/lp/types";

// MsgAddLiquidity declares a symmetric add intent. The qbtc_amount is locked
// into the lp module account immediately; the caller then sends btc_amount
// (within tolerance) to the vault with memo "+:<pending_id>". Once observed,
// units are issued via the symmetric CLP formula.
//
// The btc_address must be proven owned by the signer with a ZK proof bound the
// same way as MsgClaimWithProof. On subsequent adds the LP record's existing
// btc_address is enforced; mismatches are rejected.
message MsgAddLiquidity {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "lp/MsgAddLiquidity";

  string signer = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string node_id = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string qbtc_amount = 3 [
    (cosmos_proto.scalar) = "cosmos.Uint",
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string btc_amount_declared = 4 [
    (cosmos_proto.scalar) = "cosmos.Uint",
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string btc_address = 5;
  string proof = 6;                   // hex ZK proof
  string message_hash = 7;
  string address_hash = 8;
  string qbtc_address_hash = 9;
  string pub_key_hash_sha256 = 10;
}

message MsgAddLiquidityResponse {
  uint64 pending_add_id = 1;
}
