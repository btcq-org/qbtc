syntax = "proto3";
package qbtc.secured.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/btcq-org/qbtc/x/secured/types";
option (gogoproto.goproto_getters_all) = false;

// VaultStatus tracks the lifecycle of the DKLS vault.
enum VaultStatus {
  VAULT_STATUS_UNSPECIFIED = 0;
  VAULT_STATUS_ACTIVE = 1;
  VAULT_STATUS_CHURNING = 2;
  VAULT_STATUS_RETIRED = 3;
}

// VaultScriptType captures the on-chain output script the vault address
// represents. Phase A targets P2WPKH from a single DKLS-aggregated pubkey.
enum VaultScriptType {
  VAULT_SCRIPT_TYPE_UNSPECIFIED = 0;
  VAULT_SCRIPT_TYPE_P2WPKH = 1;
  VAULT_SCRIPT_TYPE_P2TR = 2;
  VAULT_SCRIPT_TYPE_P2WSH = 3;
}

// OutboundReason classifies why a TxOutItem was queued.
enum OutboundReason {
  OUTBOUND_REASON_UNSPECIFIED = 0;
  OUTBOUND_REASON_LP_WITHDRAW = 1;
  OUTBOUND_REASON_SWAP = 2;
  OUTBOUND_REASON_REFUND = 3;
  OUTBOUND_REASON_CONSOLIDATE = 4;
  OUTBOUND_REASON_MIGRATE = 5;
}

// OutboundStatus tracks the lifecycle of a queued BTC outbound.
enum OutboundStatus {
  OUTBOUND_STATUS_UNSPECIFIED = 0;
  OUTBOUND_STATUS_QUEUED = 1;
  OUTBOUND_STATUS_SIGNING = 2;
  OUTBOUND_STATUS_BROADCAST = 3;
  OUTBOUND_STATUS_CONFIRMED = 4;
  OUTBOUND_STATUS_FAILED = 5;
}

// Vault holds the DKLS-MPC custody state for the BTC<->qbtc pool. There is
// exactly one Vault item; HD-derived addresses rotate inside it via
// next_hd_index.
message Vault {
  bytes pubkey_secp256k1 = 1;        // 33-byte compressed secp256k1
  bytes hd_chain_code = 2;
  uint64 next_hd_index = 3;
  string active_address = 4;          // bech32 BTC address derived from current index
  VaultScriptType script_type = 5;
  uint32 threshold_m = 6;
  uint32 threshold_n = 7;
  repeated string members = 8;        // validator cons-addrs in current signer set
  int64 created_at_height = 9;
  int64 last_churn_height = 10;
  VaultStatus status = 11;
}

// TxOutItem is a queued BTC outbound instruction signed off-chain by bifrost
// and confirmed back to the chain via MsgObservedTxOut.
message TxOutItem {
  uint64 id = 1;
  string destination = 2;             // BTC bech32 address
  string amount_sats = 3 [
    (cosmos_proto.scalar) = "cosmos.Uint",
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string memo = 4;                    // OP_RETURN payload (max 80B)
  OutboundReason reason = 5;
  string ref_id = 6;                  // back-link to LP / swap / etc.
  OutboundStatus status = 7;
  int64 created_height = 8;
  string broadcast_tx_id = 9;
  repeated string signers = 10;
  uint32 retry_count = 11;
}

// ObservedTxIn is a single inbound BTC tx witnessed by a validator.
// MsgObservedTxIn carries a list of these plus stake-weighted attestations.
message ObservedTxIn {
  string txid = 1;
  uint32 vout = 2;
  string btc_sender = 3;              // recovered from input prevout for refund routing
  string btc_recipient = 4;           // must equal Vault.active_address (or any prior index)
  string amount_sats = 5 [
    (cosmos_proto.scalar) = "cosmos.Uint",
    (gogoproto.customtype) = "cosmossdk.io/math.Uint",
    (gogoproto.nullable) = false
  ];
  string memo = 6;
  uint64 btc_block_height = 7;
  uint32 confirmations = 8;
}

// Attestation matches qbtc.qbtc.v1.Attestation: a per-validator signature over
// the observation set. Quorum is enforced as >= 2/3 stake-weighted in the
// handler, mirroring x/qbtc/keeper/handler_msg_report_block.go.
message Attestation {
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bytes signature = 2;
}
