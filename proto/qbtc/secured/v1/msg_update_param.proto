syntax = "proto3";
package qbtc.secured.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/btcq-org/qbtc/x/secured/types";

// MsgUpdateParam updates a single Mimir-style int64 parameter in the secured
// module. Authority-gated (governance by default).
message MsgUpdateParam {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "secured/MsgUpdateParam";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  string key = 2;
  int64 value = 3;
}

message MsgUpdateParamResponse {}
