syntax = "proto3";
package qbtc.qbtc.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "qbtc/qbtc/v1/type_utxo.proto";
import "qbtc/qbtc/v1/query_params.proto";

option go_package = "github.com/btcq-org/qbtc/x/qbtc/types";

message mimir {
  string key = 1;
  int64 value = 2;
}

// GenesisState defines the btcq module's genesis state.
message GenesisState {
  repeated mimir mimirs = 1 [ (gogoproto.nullable) = false ];
  repeated GenesisPeerAddress peer_addresses = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.jsontag) = "peer_addresses",
    (gogoproto.customname) = "PeerAddresses"
  ];
  repeated UTXO utxos = 3;
  repeated Param params = 4;
  // The PLONK verifying key for ZK proof verification.
  // This is generated during setup and embedded in genesis.
  // All nodes use this same VK for proof verification.
  bytes zk_verifying_key = 5 [
    (gogoproto.jsontag) = "zk_verifying_key",
    (gogoproto.customname) = "ZkVerifyingKey"
  ];
  // The first Bitcoin block height the chain processes. The anchor below is
  // the block at btc_initial_height - 1.
  uint64 btc_initial_height = 6;
  // The 80-byte header of the Bitcoin block at btc_initial_height - 1. The
  // first processed block must link to it. Without an anchor no Bitcoin block
  // is accepted.
  bytes btc_anchor_header = 7;
  // The timestamp of the first block of the anchor's difficulty period (the
  // block at a height that is a multiple of 2016). Needed to check the
  // difficulty retarget at the next period boundary.
  uint32 btc_anchor_period_start_time = 8;
  // The Bitcoin network whose consensus rules apply: "mainnet" (the default
  // when empty) or "regtest" (tests and local networks only).
  string btc_network = 9;
}

message GenesisPeerAddress {
  string validator = 1;
  string peer_address = 2 [ (gogoproto.customname) = "PeerAddress" ];
}
