syntax = "proto3";
package qbtc.qbtc.v1;

option go_package = "github.com/btcq-org/qbtc/x/qbtc/types";

// UTXO is a slim representation of a Bitcoin unspent output retained by qbtc.
// Only the fields the chain actually consumes at claim time are kept; the
// original verbose script_pub_key (hex/type) is dropped because nothing reads
// it after the block is processed.
message UTXO {
  // The Bitcoin transaction id, raw 32-byte little-endian.
  bytes txid = 1;
  // The output index within the transaction.
  uint32 vout = 2;
  // The output amount in satoshis.
  uint64 amount = 3;
  // The amount entitled to be claimed from this UTXO.
  uint64 entitled_amount = 4;
  // The 20-byte hash160 of the output's address (P2PKH or P2WPKH only). qbtc
  // only supports outputs that hash160-bind cleanly to the ZK circuit; other
  // output types are dropped during ingestion.
  bytes address = 5;
}
