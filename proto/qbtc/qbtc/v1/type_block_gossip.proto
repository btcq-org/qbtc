syntax = "proto3";
package qbtc.qbtc.v1;

option go_package = "github.com/btcq-org/qbtc/x/qbtc/types";

import "qbtc/qbtc/v1/msg_report_block.proto";

// BlockGossip represents a gossiped Bitcoin block along with an attestation.
message BlockGossip {
  // The height of the Bitcoin block being gossiped.
  uint64 height = 1;

  // The 32-byte hash of the Bitcoin block being gossiped.
  bytes hash = 2;

  // The structured block commit (header + slim transactions). The attached
  // attestation is a signature over proto.Marshal(commit).
  BtcBlockCommit commit = 3;

  // An attestation for the gossiped block.
  Attestation attestation = 4;
}
