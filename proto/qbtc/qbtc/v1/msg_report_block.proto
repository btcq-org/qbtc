syntax = "proto3";
package qbtc.qbtc.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/btcq-org/qbtc/x/qbtc/types";
option (gogoproto.goproto_getters_all) = false;
option (gogoproto.goproto_stringer_all) = true;
option (gogoproto.stringer_all) = false;

message Attestation {
  string address = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  bytes signature = 2;
}

// BtcBlockCommit is the Bitcoin block content that validators attest to.
// The chain recomputes every txid from txs, checks the merkle root against
// the header, and checks the header's proof of work, difficulty and link to
// the previous block, so the content does not rest on the attestations alone.
message BtcBlockCommit {
  // The 80-byte serialized block header.
  bytes header = 1;
  // Every transaction of the block, in block order, each in Bitcoin's
  // serialization without witness data, so its double SHA-256 is its txid.
  repeated bytes txs = 2;
}

message MsgBtcBlock {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "btcq/MsgBtcBlock";

  // The height of the reported Bitcoin block
  uint64 height = 1;

  // The hash of the reported Bitcoin block, in the usual (byte-reversed) hex
  string hash = 2;

  // The gzip-compressed proto encoding of the block's BtcBlockCommit.
  // Attestations sign the uncompressed encoding.
  bytes block_content = 3;

  repeated Attestation attestations = 4;
  string signer = 5 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
}