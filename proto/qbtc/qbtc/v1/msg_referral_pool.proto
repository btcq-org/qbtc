syntax = "proto3";
package qbtc.qbtc.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/btcq-org/qbtc/x/qbtc/types";

// MsgFundReferralPool moves coins from the reserve module account to the
// referral pool. Only the governance authority can send it.
message MsgFundReferralPool {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "qbtc/MsgFundReferralPool";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Amount to move, in the bond denom.
  uint64 amount = 2;
}

// MsgDrainReferralPool moves coins from the referral pool back to the reserve
// module account. Only the governance authority can send it.
message MsgDrainReferralPool {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "qbtc/MsgDrainReferralPool";

  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  // Amount to move, in the bond denom.
  uint64 amount = 2;
}
